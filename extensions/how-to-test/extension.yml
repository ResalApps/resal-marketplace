schema_version: "1.0"

extension:
  id: how-to-test
  name: "How-To-Test"
  version: "1.3.0"
  description: "Generate QA-facing How-To-Test manuals from completed Spec Kit features, with diagram assets, screenshots, API samples, and an optional readiness audit that adds missing E2E/API/screenshot/diagram tasks before implementation."
  author: "Samy K. Abushanab"
  repository: "https://github.com/ResalApps/resal-marketplace"
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit-document.how-to-test
      file: commands/speckit-document.how-to-test.md
      description: "Generate or update the QA-facing How-To-Test manual, including diagram assets when relevant, for the completed active feature"
    - name: speckit-document.analyze-how-to-test
      file: commands/speckit-document.analyze-how-to-test.md
      description: "Find missing E2E/API/screenshot/diagram documentation-readiness tasks and add them to the active feature tasks.md"

hooks:
  after_implement:
    command: speckit-document.how-to-test
    optional: true
    prompt: "Generate or update the How-To-Test manual and diagram assets now that implementation is complete?"
    description: "Recommended phase for manual and diagram generation: after implementation completion validation, after any implementation review hook if configured, and before PR handoff/human QA review"
  after_tasks:
    command: speckit-document.analyze-how-to-test
    optional: true
    prompt: "Analyze tasks.md for missing E2E/API/screenshot/diagram coverage needed before How-To-Test documentation?"
    description: "Recommended phase: after tasks are generated and before implementation starts, so missing E2E/API/screenshot/diagram documentation-readiness tasks are implemented with the feature"

tags:
  - "qa"
  - "testing"
  - "e2e"
  - "playwright"
  - "documentation"
  - "diagram"
  - "how-to-test"
  - "workflow"
