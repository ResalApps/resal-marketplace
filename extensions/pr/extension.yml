schema_version: "1.0"

extension:
  id: pr
  name: "Detailed PR Generator"
  version: "1.0.1"
  description: "Generate a feature CHANGELOG and a plain-English feature-details document from Spec Kit artifacts, then create or update the pull request description with the feature details under a review heading."
  author: "Samy K. Abushanab"
  repository: "https://github.com/ResalApps/resal-marketplace"
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false
    - name: gh
      required: false

provides:
  commands:
    - name: speckit.pr.generate
      file: commands/speckit.pr.generate.md
      description: "Generate the feature CHANGELOG + plain-English feature-details doc, then create or update the PR description with the feature details"

hooks:
  after_implement:
    command: speckit.pr.generate
    optional: true
    prompt: "Generate the feature CHANGELOG + feature-details doc and update the PR description?"
    description: "Produce reviewer-facing docs and inject the feature details into the PR description after implementation"

tags:
  - "pr"
  - "changelog"
  - "documentation"
  - "review"
  - "workflow"
